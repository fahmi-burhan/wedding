# deploy/nginx-undangan.conf — Nginx sebagai reverse proxy + HTTPS di depan server Node.
# Pasang:  sudo cp deploy/nginx-undangan.conf /etc/nginx/sites-available/undangan
#          sudo ln -s /etc/nginx/sites-available/undangan /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d wedding.sahoor.cloud      (HTTPS gratis Let's Encrypt)
# Ganti wedding.sahoor.cloud dengan domain Anda.
server {
    listen 80;
    server_name wedding.sahoor.cloud;

    # Batas ukuran body (RSVP sangat kecil).
    client_max_body_size 16k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        # Port = PORT di .env (saat ini 4234).
        proxy_pass http://127.0.0.1:4234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP asli tamu → dibaca Express karena TRUST_PROXY=loopback di .env.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
