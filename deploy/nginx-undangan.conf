# deploy/nginx-undangan.conf — Nginx sebagai reverse proxy + HTTPS di depan server Node.
# Pasang:  sudo cp deploy/nginx-undangan.conf /etc/nginx/sites-available/undangan
#          sudo ln -s /etc/nginx/sites-available/undangan /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d undangan.domainanda.id      (HTTPS gratis Let's Encrypt)
# Ganti undangan.domainanda.id dengan domain Anda.
server {
    listen 80;
    server_name undangan.domainanda.id;

    # Batas ukuran body (RSVP sangat kecil).
    client_max_body_size 16k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP asli tamu → dibaca Express karena TRUST_PROXY=loopback di .env.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
